<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse schools across Zambia by province, district, and town through the EduNav directory." />
    <title>Schools Directory | EduNav</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand" aria-label="EduNav home page">
          <span class="brand-mark">E</span>
          EduNav
        </a>

        <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="schools.html" class="active">Schools</a>
          <a href="map.html">Map</a>
          <a href="services.html">Services</a>
          <a href="about.html">About</a>
        </nav>

        <a href="map.html" class="btn btn-primary nav-cta">Explore map</a>
      </div>
    </header>

    <main>
      <section class="page-hero">
        <div class="container">
          <p class="eyebrow">SCHOOLS DIRECTORY</p>
          <h1>Search schools by region.</h1>
          <p>Use the filters to browse schools across Zambia by province, district, town, or school name.</p>
        </div>
      </section>

      <section class="page-shell">
        <div class="container">
          <div class="filter-bar">
            <label>
              Province
              <select id="provinceFilter"></select>
            </label>
            <label>
              District
              <select id="districtFilter"></select>
            </label>
            <label>
              Town
              <select id="townFilter"></select>
            </label>
            <label>
              School type
              <select id="schoolTypeFilter">
                <option value="All">All school types</option>
                <option value="Boarding">Boarding</option>
                <option value="Day">Day</option>
              </select>
            </label>
            <label>
              Search
              <input id="schoolSearch" type="search" placeholder="School, town, province" />
            </label>
          </div>

          <div class="school-results" style="margin-top: 24px;">
            <h2 id="schoolCount">Schools found</h2>
          </div>

          <div id="schoolResults" class="school-results"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <div>
          <a href="index.html" class="brand footer-brand">
            <span class="brand-mark">E</span>
            EduNav
          </a>
        </div>

        <nav class="footer-nav" aria-label="Footer links">
          <a href="schools.html">Schools</a>
          <a href="map.html">Map</a>
          <a href="services.html">Services</a>
          <a href="about.html">About</a>
        </nav>

        <p>© <span id="year"></span> EduNav. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
